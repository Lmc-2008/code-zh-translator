name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 翻译引擎测试
        run: node tests/test-translator.js
      - name: 注释插入测试
        run: node tests/test-insert-core.js
      - name: 扩展激活测试
        run: node tests/test-extension.js
